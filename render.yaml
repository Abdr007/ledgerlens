# Render Blueprint — the API as infrastructure-as-code.
#
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repo.
#
# The image is the same one used for Cloud Run and local Docker; its entrypoint
# honours $PORT, which Render injects, so nothing here is Render-specific except
# the plan and the health check path.
#
# Secrets (`sync: false`) are deliberately *not* in this file. Render prompts for
# them on first deploy and stores them encrypted. A blueprint lives in a public
# repository — the day it carries a database password is the day the password is
# public.
services:
  - type: web
    name: ledgerlens-api
    runtime: docker
    plan: free
    region: ohio # us-east, the same region as the Neon project
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # --- Set once, in the Render dashboard -----------------------------
      # Neon pooled connection string, including ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Optional: leave unset and the deterministic offline engine runs, so the
      # pipeline still works end to end without a model key.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false

      # --- Safe to keep in version control -------------------------------
      # The frontend's origin. A domain name is not a secret, so it belongs in the
      # blueprint where it is reviewable and deploys itself — unlike the keys above.
      # Never "*": CORS is the only thing stopping another origin from driving this
      # API with a signed-in visitor's browser.
      - key: ALLOWED_ORIGINS
        value: https://ledgerlens-jet.vercel.app
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: ENVIRONMENT
        value: prod
      - key: LOG_LEVEL
        value: INFO
      # Render terminates TLS at one proxy in front of the container. Counting
      # exactly one hop is what makes the per-IP rate limit both correct and
      # unspoofable: trust zero and every client shares one bucket, trust the
      # whole X-Forwarded-For chain and any caller can forge a fresh identity.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Spec §7: 10 uploads/minute/IP on the expensive path. Reads are cheap and
      # the pipeline visual polls about once a second, so they get their own ceiling.
      - key: RATE_LIMIT
        value: 10/minute
      - key: READ_RATE_LIMIT
        value: 600/minute
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
